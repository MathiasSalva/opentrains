[workspace]
resolver = "2"
members = ["crates/core"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
